<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ · Vishisht Choudhary</title>
<meta name="description" content="$description$">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap">
<link rel="stylesheet" href="../assets/site.css?v=6">
<script src="../assets/theme.js" defer></script>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="name caps" href="../">Vishisht Choudhary</a>
    <nav><a href="../#papers">Papers</a><a href="../#writing">Writing</a><a href="https://github.com/VishiATChoudhary">GitHub</a></nav>
    <button class="theme-toggle" type="button" aria-label="Switch to light theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <article>
    <header class="article-head">
      <h1>$title$</h1>
      <div class="meta">$date$ · $readtime$ min read</div>
    </header>
$if(hero)$
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&display=swap">
    <figure class="hero">
      <canvas class="skyline" role="img" aria-label="$hero-alt$"></canvas>
      <figcaption>$hero$</figcaption>
    </figure>
    <script src="../assets/skyline.js" defer></script>
$endif$
$if(toc)$
    <nav class="toc" aria-label="Contents">
      <p class="toc-label">Contents</p>
$table-of-contents$
    </nav>
$endif$
    <div class="prose">
$body$
    </div>
  </article>

  <footer class="colophon">
    <a href="../">&larr; Index</a>
    <a href="https://github.com/VishiATChoudhary">github.com/VishiATChoudhary</a>
  </footer>
</div>
</body>
</html>
